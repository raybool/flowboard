name: Security regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-postgres:
    name: PostgreSQL security integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowboard
          POSTGRES_PASSWORD: flowboard_ci_password
          POSTGRES_DB: flowboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowboard -d flowboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Apply Prisma migrations to isolated test database
        env:
          DATABASE_URL: postgresql://flowboard:flowboard_ci_password@localhost:5432/flowboard_test
        run: pnpm --filter api db:deploy

      - name: Run mandatory PostgreSQL security suite
        env:
          TEST_DATABASE_URL: postgresql://flowboard:flowboard_ci_password@localhost:5432/flowboard_test
        run: pnpm --filter api test:postgres
